name: Metrics
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: nnamu-cl
          filename: metrics.svg
          template: classic
          base: ""
          config_timezone: Africa/Kampala
          config_display: large
          config_order: languages, isocalendar
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          plugin_languages: yes
          plugin_languages_limit: 5
          plugin_languages_ignored: html, css, cmake, batchfile, makefile
          plugin_languages_skipped: psiEngine, nnamu-cl
